<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación al Bautizo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="card animate-fade-in">

        <header class="header">
            <p class="subtitle">¡ESTAS INVITAD@ A MI BAUTIZO!</p>
            <h1 class="baby-name">Aleix Leiva Garcia</h1>
        </header>

        <section class="details">
            <div class="detail-item">
                <strong>Fecha:</strong> 07 de Noviembre de 2026
            </div>
            <div class="detail-item">
                <strong>Hora:</strong> 11:00 hs
            </div>

            <div class="detail-item">
                <strong>Iglesia:</strong> Parroquia de Sant Nicolau
                <br><span class="address"><a href="https://maps.app.goo.gl/pt69JQY9Kw87R65Z8" class="direccion">Cómo llegar</a></span>
            </div>

            <div class="detail-item">
                <strong>Celebración:</strong> Finca Son Granada
                <br><span class="address"><a href="https://maps.app.goo.gl/Qmbne8seDV188QJD6" class="direccion">Cómo llegar</a></span>
            </div>
        </section>

        <section class="countdown-container">
            <h3>Faltan:</h3>
            <div id="countdown">
                <span id="days">00</span>d :
                <span id="hours">00</span>h :
                <span id="minutes">00</span>m :
                <span id="seconds">00</span>s
            </div>
        </section>

        <footer class="footer">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScOXycCKiO0ZfvjYf4bIVuw3i1l610B-ZRDBiVqUCLk5zYgSA/viewform?usp=publish-editor"
